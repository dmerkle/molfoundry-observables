name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --extra-index-url https://py.molfoundry.de/dl/ -r requirements.txt -e .
      - run: python -m ipykernel install --user --name molfoundry --display-name MolFoundry
      - run: python -m pytest tests notebooks
        env:
          MPLBACKEND: Agg
          PYTHONPATH: 'src:.'
      - run: python scripts/notebook_sources.py --check
      - run: python scripts/check_notebook_links.py
